openapi: 3.0.3
info:
  title: Interledger Merchant POS API
  version: 0.1.0
  description: |
    The **Interledger Merchant POS API** contains the Merchant API endpoints
    that POS terminals call:

    - **Onboarding** — the terminal gets the onboarding form and submits the
      merchant data. The API then links the terminal to its merchant and
      returns the terminal's API key.
    - **Authorization** — the terminal sends the kernel output of a card
      transaction. The API returns the result of the issuer.
    - **Finalization** — the terminal sends its final decision on an approved
      authorization. Only an approval moves money.

    `merchant-api.yaml` describes the management of merchants, locations,
    terminals and manufacturer models.

    ## Authentication

    Authorization and finalization requests carry the API key of the
    terminal in the `X-API-Key` header. The onboarding endpoints require no authentication.
    A terminal has no API key before onboarding.

    A successful onboarding returns the API key once. An API key belongs to
    one terminal, and a terminal has at most one. The key stops working when
    the terminal is reset, revoked or deleted. A terminal that lost its key is
    reset by an operator and onboarded again.

    ## Conventions

    * All requests and responses use `application/json` (UTF-8) unless
      explicitly stated otherwise.
    * Timestamps are ISO 8601 / RFC 3339 in UTC (`2025-01-31T12:34:56Z`).
    * `terminalId` is a UUIDv4 that the server issues.
    * `requestId` is a UUID that the terminal generates.
    * Errors are returned as **RFC 7807 Problem Details for HTTP APIs**
      objects (see [`Problem`](#/components/schemas/Problem)) with
      `type`, `title`, `status`, `detail` and `instance` fields. The
      `instance` field carries the server-assigned request correlation
      ID and should be quoted when reporting issues.

tags:
  - name: pos-onboarding
    description: |
      Onboarding flow executed by the POS device itself to retrieve the
      onboarding form definition, submit the collected merchant data and
      link the device to its merchant.
  - name: pos-authorization
    description: |
      Authorize and finalize card transactions from a POS device.

paths:
  /v1/terminals/{serialNumber}/onboard:
    parameters:
      - $ref: '#/components/parameters/SerialNumber'
    get:
      operationId: getTerminalOnboardingDefinition
      summary: Retrieve the terminal onboarding form definition
      description: >
        Returns the set of fields, their metadata and validation rules required
        for a terminal to render the onboarding form. The FSP chooses the fields
        for the merchant of the terminal. Public endpoint; no authentication
        required.
      tags:
        - pos-onboarding
      responses:
        '200':
          description: Onboarding form definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingFormDefinition'
              examples:
                default:
                  $ref: '#/components/examples/OnboardingFormDefinitionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
    post:
      operationId: submitTerminalOnboarding
      summary: Submit onboarding data and link a terminal to a merchant
      description: >
        Submits merchant data collected on the terminal, validates it against the
        onboarding field model, verifies it via FSP and links the terminal with
        this serial number to its merchant. The terminal becomes `ACTIVE` and
        the response carries its API key. This endpoint requires no
        authentication.
      tags:
        - pos-onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingSubmission'
            examples:
              default:
                $ref: '#/components/examples/OnboardingSubmissionExample'
      responses:
        '200':
          description: >
            Onboarding verified and terminal linked. The only response that
            carries the API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
              examples:
                linked:
                  $ref: '#/components/examples/OnboardingResultExample'
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: "#/components/responses/UnprocessableContent"
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/transactions/authorize:
    post:
      summary: Authorize POS transactions
      operationId: authorizeTransaction
      tags:
        - pos-authorization
      description: |
        Authorize a transaction for a POS device.

        Only an `ACTIVE` terminal can authorize; another terminal with a valid
        API key gets `403`. The API returns `404` when `terminalId` is unknown
        or is not the terminal of the API key.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: |
            The issuer decided. Its result is in `data.authorization`. A decline
            is also a `200`: the ARC (EMV tag `8A`) gives the outcome.

            After an approving ARC, no money moves until the terminal calls
            `POST /v1/transactions/{requestId}/finalize`. A declined
            authorization is not finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransactionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/transactions/{requestId}/finalize:
    post:
      summary: Finalize an approved POS transaction
      operationId: finalizeTransaction
      tags:
        - pos-authorization
      description: |
        Sends the final decision of the terminal on an authorization, after
        `/v1/transactions/authorize` returned an approving ARC.

        - `approve` completes the payment.
        - `reject` cancels the transaction. No money moves.

        Repeating the outcome a transaction was finalized with returns the
        same `200` again. The API returns `404` when the `requestId` is
        unknown or belongs to another terminal, or when `terminalId` is not
        the terminal of the API key, and `409` when the
        transaction is not in a state the outcome can apply to (see
        `TransactionConflict`). Problem `type` identifies each case.

        A terminal that was suspended after `/authorize` can still finalize.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          description: The `requestId` of the approved `/v1/transactions/authorize` call.
          schema:
            type: string
            format: uuid
            x-go-type: string
          example: 018f8d2e-3c1a-7b6e-9f0a-2c4d6e8f0a1b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeRequest'
      responses:
        '200':
          description: |
            The transaction is finalized. `data.status` is `completed` after
            `approve` and `rejected` after `reject`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResponse'
        '202':
          description: |
            `approve` was accepted but the payment is not completed yet, and
            may still complete. `data.status` is `pending`. Don't show success
            or failure. Call `/finalize` again with `approve` to check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransactionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PaymentBadGateway'

components:
  parameters:
    SerialNumber:
      name: serialNumber
      in: path
      required: true
      description: Hardware serial number of the terminal, percent-encoded.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: SN-AB12-9931

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: The API key that the terminal received at onboarding.

  responses:
    BadRequest:
      description: Bad request (invalid JSON, invalid parameters, validation errors).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidJson:
              summary: Invalid JSON payload
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Request body is not valid JSON.
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            validationError:
              summary: Field validation failed
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: invalid country code
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingAuth:
              summary: Missing credentials
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication is required.
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            invalidAuth:
              summary: Invalid API key
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials are invalid or expired.
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    Forbidden:
      description: The API key is valid, but the terminal is not `ACTIVE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            terminalNotActive:
              summary: Terminal is not active
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: terminal is not active
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            terminalNotFound:
              summary: Terminal does not exist
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: resource not found
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            transactionNotFound:
              summary: No transaction to finalize
              value:
                type: tag:interledger.org,2026:problems/transaction-not-found
                title: Transaction not found
                status: 404
                detail: transaction not found
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    TransactionConflict:
      description: |
        The transaction is not in a state the request can apply to:
        - `request-id-used`: `/authorize` with a `requestId` that was already
          used. Use a new `requestId`.
        - `transaction-finalizing`: another `/finalize` call for the
          transaction is running. Retry later.
        - `outcome-not-allowed`: the transaction's state doesn't allow this
          outcome, for example the opposite outcome on a finalized
          transaction, `reject` after a `202`, `approve` after a `502`, or
          any outcome after the issuer declined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            requestIdUsed:
              summary: The requestId was already used
              value:
                type: tag:interledger.org,2026:problems/request-id-used
                title: Request id already used
                status: 409
                detail: request id already used
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            transactionFinalizing:
              summary: Transaction is being finalized
              value:
                type: tag:interledger.org,2026:problems/transaction-finalizing
                title: Transaction is being finalized
                status: 409
                detail: transaction is being finalized
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            outcomeNotAllowed:
              summary: The transaction's state doesn't allow this outcome
              value:
                type: tag:interledger.org,2026:problems/outcome-not-allowed
                title: Outcome not allowed
                status: 409
                detail: outcome not allowed
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    PaymentBadGateway:
      description: |
        The payment or the cancellation failed upstream. After a `502` the
        terminal can call `/finalize` again with `reject`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paymentFailed:
              summary: Payment failed
              value:
                type: tag:interledger.org,2026:problems/upstream-failed
                title: Upstream failed
                status: 502
                detail: payment failed
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            cancellationFailed:
              summary: Cancellation failed
              value:
                type: tag:interledger.org,2026:problems/upstream-failed
                title: Upstream failed
                status: 502
                detail: cancellation failed
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    Conflict:
      description: The definition token is expired, a newer form definition replaces it, or the terminal is not awaiting onboarding.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            definitionExpired:
              summary: Definition token is expired
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: definition token expired
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
            terminalNotOnboardable:
              summary: Terminal is not awaiting onboarding
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: terminal is not awaiting onboarding
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    BadGateway:
      description: The FSP onboarding API could not be reached or answered unexpectedly.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            fspUnavailable:
              summary: FSP onboarding API is unavailable
              value:
                type: about:blank
                title: Bad Gateway
                status: 502
                detail: FSP onboarding API is unavailable
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    InternalError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unexpected:
              summary: Unexpected error
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

    UnprocessableContent:
      description: Unprocessable content
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            dataVerificationFailed:
              summary: Content cannot be processed
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: data cannot be processed by the upstream
                instance: 07cf97fa-7c93-4d22-8ad5-eba4116672e6

  examples:
    OnboardingResultExample:
      summary: Terminal linked
      value:
        status: ACTIVE
        terminalId: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        serialNumber: SN-AB12-9931
        merchantId: 7c1f4f9a-4b8e-4c7e-9c2a-2c5d4f2a1b3e
        apiKey: ilfpos_EXAMPLE-not-a-real-key-0000000000000000000
        linkedAt: "2026-06-01T10:15:30Z"
    OnboardingSubmissionExample:
      summary: Example submission
      value:
        definitionToken: "eyJhbGciOiJIUzI1NiJ9.eyJoIjoiOWYyYzhhMSIsImV4cCI6MTc4MDM0NjQwMH0.q8Xr2bV1nKpZ"
        data:
          businessName: Interledger Foundation
          legalEntityName: Interledger Foundation
          registrationNumber: "12345678"
          taxId: TAX123456789
          merchantCategoryCode: "8398"
          contactEmail: me@interledger.org
          contactPhone: "+01 01 0000 0000"
          country: US
          addressLine1: 610 E Zack St
          city: Tampa, Florida
          postalCode: 33602
          settlementCurrency: USD
          walletAddress: https://ilp.interledger-test.dev/007
          acceptedTerms: true

    OnboardingFormDefinitionExample:
      summary: Example onboarding form definition
      value:
        version: "2026-06-01"
        definitionToken: "eyJhbGciOiJIUzI1NiJ9.eyJoIjoiOWYyYzhhMSIsImV4cCI6MTc4MDM0NjQwMH0.q8Xr2bV1nKpZ"
        title: Merchant onboarding
        fields:
          - key: businessName
            label: Business name
            type: text
            required: true
            placeholder: Interledger Foundation
            order: 1
            validation:
              minLength: 2
              maxLength: 120
          - key: merchantCategoryCode
            label: Merchant category
            type: select
            required: true
            order: 5
            options:
              - value: "5411"
                label: Grocery stores / supermarkets
              - value: "5812"
                label: Eating places / restaurants
              - value: "8389"
                label: Charitable and Social Service Organizations
              - value: "5999"
                label: Miscellaneous retail
          - key: contactEmail
            label: Contact email
            type: email
            required: true
            placeholder: me@interledger.org
            order: 6
            validation:
              format: email
              maxLength: 254
          - key: walletAddress
            label: Wallet address
            type: text
            required: true
            placeholder: https://ilp.interledger-test.dev/007
            order: 15
            validation:
              format: uri
              maxLength: 200
          - key: acceptedTerms
            label: I accept the terms of service
            type: checkbox
            required: true
            order: 16
            validation:
              mustEqual: true

  schemas:
    OnboardingResult:
      type: object
      required: [status, terminalId, serialNumber, merchantId, apiKey]
      properties:
        status:
          type: string
          description: Outcome of the onboarding submission; `ACTIVE` when the terminal was successfully linked to the merchant and can take payments.
          example: ACTIVE
        terminalId:
          type: string
          format: uuid
          x-go-type: string
          description: Server-issued terminal identifier. The terminal sends it in its transaction requests.
          example: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        serialNumber:
          type: string
          example: SN-AB12-9931
        merchantId:
          type: string
          description: Identifier of the merchant the terminal is now linked to.
          example: 7c1f4f9a-4b8e-4c7e-9c2a-2c5d4f2a1b3e
        apiKey:
          type: string
          x-oapi-codegen-extra-tags:
            sensitive: credential
          description: >
            The API key of the terminal, for the `X-API-Key` header. It is
            returned only here and cannot be read again. Opaque; do not parse.
          example: ilfpos_EXAMPLE-not-a-real-key-0000000000000000000
        linkedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:15:30Z"

    OnboardingSubmission:
      type: object
      required: [definitionToken, data]
      properties:
        definitionToken:
          type: string
          x-oapi-codegen-extra-tags:
            sensitive: credential
          description: >
            The `definitionToken` from
            `GET /v1/terminals/{serialNumber}/onboard`, for the form
            that the terminal shows. The API verifies the signature and the
            expiry of the token, and that the token was issued for this serial
            number. The API then validates `data` against the field
            set of the token. If the token is missing or not valid, the API
            returns 400. If the token is expired or replaced, the API returns
            409. Get the definition again, then submit again.
          example: "eyJhbGciOiJIUzI1NiJ9.eyJoIjoiOWYyYzhhMSIsImV4cCI6MTc4MDM0NjQwMH0.q8Xr2bV1nKpZ"
        data:
          type: object
          x-oapi-codegen-extra-tags:
            sensitive: dynamic
          description: >
            Map of submitted values keyed by FieldDefinition.key.
          additionalProperties: true
          example:
            businessName: Interledger Foundation
            legalEntityName: Interledger Foundation
            registrationNumber: "12345678"
            taxId: TAX123456789
            merchantCategoryCode: "8398"
            contactEmail: me@interledger.org
            contactPhone: "+01 01 0000 0000"
            country: US
            addressLine1: 610 E Zack St
            city: Tampa, Florida
            postalCode: 33602
            settlementCurrency: USD
            walletAddress: https://ilp.interledger-test.dev/007
            acceptedTerms: true

    FieldGroup:
      type: object
      required: [key, label, order]
      properties:
        key:
          type: string
          example: business
        label:
          type: string
          example: Business details
        order:
          type: integer
          example: 1

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          example: "5411"
        label:
          type: string
          example: Grocery stores / supermarkets

    FieldValidation:
      type: object
      description: Declarative constraints. Clients ignore unknown keys.
      properties:
        minLength:
          type: integer
          example: 2
        maxLength:
          type: integer
          example: 120
        pattern:
          type: string
          description: ECMA-262 regular expression.
          example: "^\\+?[0-9 ]{7,15}$"
        min:
          type: number
        max:
          type: number
        format:
          type: string
          description: Semantic format hint.
          example: email
        mustEqual:
          type: boolean
          description: For checkbox consent fields, the value must equal this.

    FieldDefinition:
      type: object
      required: [key, label, type, required, order]
      properties:
        key:
          type: string
          description: Identifier of the element, camelCase. Used as the property name in the submission payload.
          example: businessName
        label:
          type: string
          example: Business name
        description:
          type: string
          description: Help text shown with the field.
        type:
          type: string
          enum: [text, email, tel, number, select, checkbox, date]
          example: text
        required:
          type: boolean
          example: true
        placeholder:
          type: string
          example: Interledger Foundation
        order:
          type: integer
          example: 1
        defaultValue:
          description: Optional pre-filled value (type matches `type`).
        options:
          type: array
          description: Allowed choices; required when type = select.
          items:
            $ref: '#/components/schemas/FieldOption'
        validation:
          $ref: '#/components/schemas/FieldValidation'

    OnboardingFormDefinition:
      type: object
      required: [version, definitionToken, fields]
      properties:
        version:
          type: string
          description: Version identifier of this definition (for caching/compat).
          example: "2026-06-01"
        definitionToken:
          type: string
          x-oapi-codegen-extra-tags:
            sensitive: credential
          description: >
            Opaque, server-signed token representing this exact form definition
            (it embeds a hash of the served field set, the serial number and an
            expiry). The terminal must send this value unchanged in its
            `POST /v1/terminals/{serialNumber}/onboard` request. The API uses the value to
            validate the submitted data against the same field set. The token
            is stateless: the backend verifies its signature
            and hash without any stored session. Treat as opaque — do not parse.
          example: "eyJhbGciOiJIUzI1NiJ9.eyJoIjoiOWYyYzhhMSIsImV4cCI6MTc4MDM0NjQwMH0.q8Xr2bV1nKpZ"
        title:
          type: string
          description: Optional human-readable form title.
          example: Merchant onboarding
        groups:
          type: array
          description: Optional ordered section metadata for visual grouping.
          items:
            $ref: '#/components/schemas/FieldGroup'
        fields:
          type: array
          description: The onboarding fields, to be rendered in ascending `order`.
          items:
            $ref: '#/components/schemas/FieldDefinition'

    AuthorizationRequest:
      type: object
      description: |
        Authorization Request.

        Only the fields needed to select keys and decrypt travel in the clear.
        The PAN, amount, currency and both wallet addresses are carried inside
        `sred` (see `AuthorizationSREDPayload`) and are read by the Merchant
        API after SRED decryption.
      required:
        - terminalId
        - requestId
        - sred
      additionalProperties: false
      properties:
        terminalId:
          type: string
          format: uuid
          x-go-type: string
          description: Server-issued terminal identifier. Must be the terminal of the API key.
          example: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        requestId:
          type: string
          format: uuid
          x-go-type: string
          description: |
            Identifier of the authorization. The terminal generates it. Use a
            new value for each authorization. The Merchant API sends this value
            as `cardAuthorization.requestId` in the Open Payments grant request.
          example: 018f8d2e-3c1a-7b6e-9f0a-2c4d6e8f0a1b
        sred:
          $ref: '#/components/schemas/AuthorizationSREDPayload'
        pin:
          $ref: '#/components/schemas/AuthorizationPINPayload'

    AuthorizationSREDPayload:
      type: object
      description: |
        SRED encrypted EMV payload from the POS.
        `cipherData` decrypts to a BER-TLV list holding the tags below.
        | Tag      | Name                              | Presence | Notes |
        |----------|-----------------------------------|----------|-------|
        | `5A`     | Application PAN                   | Required | Used as the PIN translate input. |
        | `5F34`   | PAN Sequence Number               | Optional | |
        | `9F36`   | Application Transaction Counter   | Required | |
        | `9F26`   | Application Cryptogram (ARQC)     | Required | |
        | `9F10`   | Issuer Application Data           | Required | Part of the data the card signs into the ARQC. |
        | `82`     | Application Interchange Profile   | Required | Part of the data the card signs into the ARQC. |
        | `95`     | Terminal Verification Results     | Optional | |
        | `DF31`   | CDOL1 Data                        | Required | Proprietary. The CDOL1 values as sent in GENERATE AC, layout below. |
        | `DFF101` | Cardholder Wallet Address         | Required | Wallet the outgoing payment is created on. |
        | `DFF102` | Merchant Wallet Address           | Required | Wallet the incoming payment is created on. |

        `DF31` holds the CDOL1 values in the order the card's CDOL1 lists them.
        example From the current card profile that is 56 bytes:

        | Offset | Length | Tag      | Name                                |
        |--------|--------|----------|-------------------------------------|
        | 0      | 6      | `9F02`   | Amount, Authorised                  |
        | 6      | 2      | `5F2A`   | Transaction Currency Code           |
        | 8      | 1      | `5F36`   | Transaction Currency Exponent       |
        | 9      | 3      | `9A`     | Transaction Date                    |
        | 12     | 3      | `9F21`   | Transaction Time                    |
        | 15     | 4      | `9F37`   | Unpredictable Number                |
        | 19     | 2      | `9F1A`   | Terminal Country Code               |
        | 21     | 3      | `9F34`   | CVM Results                         |
        | 24     | 32     | `DFF104` | Merchant Wallet Address SHA-256     |
      required:
        - cipherData
        - iv
        - ksn
      additionalProperties: false
      properties:
        cipherData:
          type: string
          format: byte
          x-oapi-codegen-extra-tags:
            sensitive: crypto_data
          description: binary blob from the C-2 kernel output
        iv:
          type: string
          format: byte
          description: initialization vector accompanying the ciphertext on the C-2 kernel output.
        ksn:
          type: string
          description: identifies the per-transaction DUKPT working key derived from the merchant iMEAK BDK.

    AuthorizationPINPayload:
      type: object
      description: Optional encrypted PIN payload from the POS kernel.
      required:
        - ksn
        - pinBlock
      additionalProperties: false
      properties:
        ksn:
          type: string
          minLength: 1
          description: identifies the POS's per-transaction DUKPT key derived from the iPEK.
        pinBlock:
          type: string
          format: byte
          x-oapi-codegen-extra-tags:
            sensitive: credential
          description: encrypted PIN block in ISO-9564 Format 4

    AuthorizationIncomingPayment:
      type: object
      description: Incoming payment transaction.
      required:
        - id
        - walletAddress
        - expiresAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uri
          description: The URL of the incoming payment.
          example: https://merchant.example/incoming-payments/4fbd8d6a-4d30-4c6a-82e8-1d6f75c6c7bf
        walletAddress:
          type: string
          format: uri
          x-oapi-codegen-extra-tags:
            sensitive: pii
          description: The URL of the merchant wallet address that receives the incoming payment.
          example: https://merchant.example/.well-known/pay
        expiresAt:
          type: string
          format: date-time
          description: Expiry timestamp for the incoming payment.
          example: "2026-05-29T12:34:56Z"

    AuthorizationIssuerResult:
      type: object
      description: |
        The issuer's authorization result, from `cardAuthorization` on the Open
        Payments grant response. The POS has the final say on the transaction:
        it reads the outcome from `arc`, passes `tlvData` to its kernel, and
        reports its decision with `POST /v1/transactions/{requestId}/finalize`.
      required:
        - arc
        - tlvData
      additionalProperties: false
      properties:
        arc:
          type: string
          pattern: '^[0-9A-Z]{2}$'
          description: |
            Authorization Response Code (EMV tag `8A`). `00` approves. Other
            approving codes exist, so read the outcome of a code from the
            ISO 8583 / EMV ARC table, not from `00` alone.
          example: "00"
        authCode:
          type: string
          minLength: 1
          maxLength: 6
          description: Authorization code (EMV tag `89`). Present only on approval.
          example: "A1B2C3"
        tlvData:
          type: string
          pattern: '^([0-9A-F]{2})+$'
          x-oapi-codegen-extra-tags:
            sensitive: crypto_data
          description: |
            The issuer's result as hex-encoded BER-TLV: `8A`, and when present
            `89` and `91` (Issuer Authentication Data, which carries the ARPC).
            A contact kernel needs `8A` and `91` for the second GENERATE AC.
          example: "8A023030890641314232433391081122334455667788"

    AuthorizationResponseData:
      type: object
      description: Authorization data produced by completed authorization legs.
      required:
        - incomingPayment
        - authorization
      additionalProperties: false
      properties:
        incomingPayment:
          $ref: '#/components/schemas/AuthorizationIncomingPayment'
        authorization:
          $ref: '#/components/schemas/AuthorizationIssuerResult'

    AuthorizationTransactionResponse:
      type: object
      description: POS-facing transaction response body.
      required:
        - timestamp
        - terminalId
        - requestId
        - data
      additionalProperties: false
      properties:
        timestamp:
          type: string
          format: date-time
          description: Response timestamp.
          example: "2026-05-29T12:34:56Z"
        terminalId:
          type: string
          description: POS terminal identifier from the request.
          example: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        requestId:
          type: string
          description: The `requestId` from the request.
          example: 018f8d2e-3c1a-7b6e-9f0a-2c4d6e8f0a1b
        data:
          $ref: '#/components/schemas/AuthorizationResponseData'

    AuthorizationResponse:
      type: object
      description: POS-facing authorization response envelope.
      required:
        - transactionResponse
      additionalProperties: false
      properties:
        transactionResponse:
          $ref: '#/components/schemas/AuthorizationTransactionResponse'

    FinalizeRequest:
      type: object
      description: The final decision of the terminal on an approved authorization.
      required:
        - terminalId
        - outcome
      additionalProperties: false
      properties:
        terminalId:
          type: string
          format: uuid
          x-go-type: string
          description: |
            Server-issued terminal identifier. Must be the terminal of the API
            key, and the one that sent `/v1/transactions/authorize`.
          example: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        outcome:
          $ref: '#/components/schemas/FinalizeOutcome'

    FinalizeOutcome:
      type: string
      description: |
        `approve`: the terminal accepts the transaction. `reject`: the terminal
        or the card declined it, or the cardholder cancelled.
      enum:
        - approve
        - reject
      example: approve

    FinalizeResponseData:
      type: object
      description: Result of the finalization.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `completed`: the payment is completed. `pending`: the payment is
            not completed yet and may still complete. `rejected`: the
            transaction is cancelled and no money moved.
          enum:
            - completed
            - pending
            - rejected
          example: completed
        outgoingPaymentId:
          type: string
          format: uri
          description: The URL of the outgoing payment. Present when `status` is `completed` or `pending`.
          example: https://cardholder.example/outgoing-payments/8c1e5f2a-7d3b-4e9c-a1f0-3b6d2c8e4a7f

    FinalizeTransactionResponse:
      type: object
      description: POS-facing finalization response body.
      required:
        - timestamp
        - terminalId
        - requestId
        - data
      additionalProperties: false
      properties:
        timestamp:
          type: string
          format: date-time
          description: Response timestamp.
          example: "2026-05-29T12:34:58Z"
        terminalId:
          type: string
          description: POS terminal identifier from the request.
          example: 9d2f7c10-5e3a-4b1f-8c2d-6e7f8a9b0c1d
        requestId:
          type: string
          description: The `requestId` from the path.
          example: 018f8d2e-3c1a-7b6e-9f0a-2c4d6e8f0a1b
        data:
          $ref: '#/components/schemas/FinalizeResponseData'

    FinalizeResponse:
      type: object
      description: POS-facing finalization response envelope.
      required:
        - transactionResponse
      additionalProperties: false
      properties:
        transactionResponse:
          $ref: '#/components/schemas/FinalizeTransactionResponse'

    WrappedKeys:
      type: object
      description: |
        Operational keys delivered to the POS in a wrapped (encrypted)
        key block, suitable for direct loading into the device's secure
        element.
      properties:
        scheme:
          type: string
          example: TR-34
          description: |
            Identifier of the key-wrapping scheme used to protect the
            payload (e.g. `TR-34`).
        payload:
          type: string
          format: byte
          x-oapi-codegen-extra-tags:
            sensitive: crypto_key
          description: |
            Base64-encoded wrapped key block (TR-34–style), encrypted
            for the requesting POS device.

    Problem:
      type: object
      description: |
        Error representation following [RFC 7807 — Problem Details for
        HTTP APIs](https://www.rfc-editor.org/rfc/rfc7807).

        Returned for all non-2xx responses with the
        `application/problem+json` media type. Clients should use `status`
        and `title` for programmatic handling and surface `detail` for
        diagnostics. The `instance` field carries the server-assigned
        request correlation ID and should be quoted when reporting issues.
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference identifying the problem type. Defaults to
            `about:blank`, which means the problem has no additional
            semantics beyond `title` and `status`.
          default: about:blank
          example: about:blank
        title:
          type: string
          description: |
            Short, human-readable summary of the problem type. For
            `about:blank`, this is the standard HTTP reason phrase for
            `status` (e.g. `Bad Request`, `Not Found`).
          example: Bad Request
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server for this occurrence.
          example: 400
        detail:
          type: string
          description: |
            Human-readable explanation specific to this occurrence of the
            problem. Safe to log; not intended for end-user display.
          example: invalid country code
        instance:
          type: string
          description: |
            Server-assigned correlation identifier for this request
            (the request ID). Include it when contacting support to
            enable log lookups.
          example: 07cf97fa-7c93-4d22-8ad5-eba4116672e6
