name: Check PR title

# Squash merges use the PR title as the commit message, and the release
# workflow computes the next version from it. Keep it a conventional commit.
on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  check-pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
